apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  namespace: llm-gateway
  labels:
    app.kubernetes.io/name: llm-gateway
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  # Recreate strategy required: SQLite WAL does not support concurrent writers.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-gateway
    spec:
      containers:
        - name: llm-gateway
          # Replace with a pinned tag for production, e.g. ghcr.io/shiftu/llm-gateway:0.3.0
          image: ghcr.io/shiftu/llm-gateway:latest
          imagePullPolicy: IfNotPresent
          args:
            - start
          ports:
            - name: http
              containerPort: 7421
              protocol: TCP
          env:
            # Config dir: state.db and master.key are stored here.
            - name: XDG_CONFIG_HOME
              value: /data
            # Auth token — sourced from the llm-gateway-auth Secret.
            # Edit secret.yaml to set the actual token value before applying.
            - name: LLM_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-gateway-auth
                  key: LLM_GATEWAY_TOKEN
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: llm-gateway-data
