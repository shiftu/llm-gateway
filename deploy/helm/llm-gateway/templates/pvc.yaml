{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "llm-gateway.pvcName" . }}
  labels:
    {{- include "llm-gateway.labels" . | nindent 4 }}
  annotations:
    # retainPolicy is advisory: set the PV's reclaimPolicy to Retain in your StorageClass
    # or patch the PV after provisioning to prevent data loss on chart uninstall.
    llm-gateway/retain-policy: {{ .Values.persistence.retainPolicy | quote }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- else if eq .Values.persistence.storageClass "" }}
  # storageClassName omitted — uses cluster default StorageClass
  {{- end }}
{{- end }}
