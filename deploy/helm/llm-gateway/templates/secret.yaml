{{- $hasAuthToken := and (not .Values.auth.existingSecret) .Values.auth.token -}}
{{- $hasMasterKey := and (not .Values.masterKey.existingSecret) .Values.masterKey.value -}}
{{- if $hasAuthToken }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "llm-gateway.fullname" . }}-auth
  labels:
    {{- include "llm-gateway.labels" . | nindent 4 }}
type: Opaque
data:
  {{ include "llm-gateway.authSecretKey" . }}: {{ .Values.auth.token | b64enc | quote }}
{{- end }}
{{- if $hasMasterKey }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "llm-gateway.fullname" . }}-master-key
  labels:
    {{- include "llm-gateway.labels" . | nindent 4 }}
type: Opaque
data:
  {{ include "llm-gateway.masterKeySecretKey" . }}: {{ .Values.masterKey.value | b64enc | quote }}
{{- end }}
