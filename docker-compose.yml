services:
  llm-gateway:
    build: .
    image: llm-gateway:latest
    container_name: llm-gateway
    restart: unless-stopped
    ports:
      - "7421:7421"
    volumes:
      - gateway-data:/data
    environment:
      # Required: set at least one auth token
      LLM_GATEWAY_TOKEN: ${LLM_GATEWAY_TOKEN:?Set LLM_GATEWAY_TOKEN in .env}
      # Required: master key for provider API key encryption
      LLM_GATEWAY_MASTER_KEY: ${LLM_GATEWAY_MASTER_KEY:?Set LLM_GATEWAY_MASTER_KEY in .env}
      # Optional: seed a provider on first start
      LLM_GATEWAY_PROVIDER_KIND: ${LLM_GATEWAY_PROVIDER_KIND:-deepseek}
      LLM_GATEWAY_PROVIDER_API_KEY: ${LLM_GATEWAY_PROVIDER_API_KEY:-}
      # Optional: enable Prometheus metrics
      LLM_GATEWAY_ENABLE_METRICS: ${LLM_GATEWAY_ENABLE_METRICS:-0}

volumes:
  gateway-data:
